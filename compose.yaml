services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lounge
      POSTGRES_USER: lounge
      POSTGRES_PASSWORD: lounge-local-only
    ports:
      - "5432:5432"
    volumes:
      - lounge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lounge -d lounge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lounge-postgres:
